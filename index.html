<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Sudoku Master</title>
  <link rel="icon" href="image.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🧩 Sudoku Master</h1>

    <div class="top-bar">
      <div class="theme-toggle" id="themeToggle">🌞</div>
      <div class="scoreboard">
        <span>⏱ <span id="timer">00:00</span></span> |
        <span>🏆 Best: <span id="bestTime">--:--</span></span>
      </div>
    </div>

    <div class="controls">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <button id="newGame">🆕 New</button>
      <button id="checkGame">✅ Check</button>
      <button id="solveGame">💡 Solve</button>
      <button id="hintGame">✨ Hint (<span id="hintCount">3</span>)</button>
    </div>

    <div class="sudoku-grid" id="sudokuGrid"></div>

    <div class="message" id="message"></div>
  </div>

  <canvas id="confetti"></canvas>

  <audio id="clickSound" src="sounds/click.mp3"></audio>
  <audio id="successSound" src="sounds/success.mp3"></audio>
  <audio id="errorSound" src="sounds/error.mp3"></audio>

  <script src="app.js"></script>
</body>
</html>
