<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Master</title>
  <link rel="icon" href="image.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🧩 Sudoku Master</h1>

    <div class="controls">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
      </select>

      <button id="newGame">New Game</button>
      <button id="checkGame">Check</button>
      <button id="solveGame">Solve</button>
      <button id="hintGame">Hint (<span id="hintCount">3</span>)</button>
      <button id="toggleNotes">Notes Mode</button>
      <button id="themeToggle">🌙 Dark/Light</button>

      <span id="timer">00:00</span>
    </div>

    <div class="sudoku-grid" id="sudokuGrid"></div>
    <div class="message" id="message"></div>
  </div>

  <audio id="winSound" src="win.mp3"></audio>
  <audio id="errorSound" src="error.mp3"></audio>
  <audio id="hintSound" src="hint.mp3"></audio>

  <script src="App.js"></script>
</body>
</html>
